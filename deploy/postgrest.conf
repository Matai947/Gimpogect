# /etc/postgrest/sevengym.conf — PostgREST in front of our Postgres, for our server only (127.0.0.1).
db-uri = "postgres://authenticator:A-LONG-RANDOM-PASSWORD@127.0.0.1:5432/sevengym"
db-schemas = "public"
db-anon-role = "web_anon"
server-host = "127.0.0.1"
server-port = 3000
db-max-rows = 1000
# at least 32 random characters; the server's DB_REST_TOKEN is signed with it (see MIGRATION.md, step 4)
jwt-secret = "A-SECRET-OF-AT-LEAST-32-CHARACTERS"
