# /etc/nginx/sites-available/sevengym — both addresses serve the same app (old clients keep sevengim.matai.kz).
# HTTPS certificates: sudo certbot --nginx -d sevengym.matai.kz -d sevengim.matai.kz
server {
    listen 80;
    server_name sevengym.matai.kz sevengim.matai.kz;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the API counts wrong codes per device by this address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
