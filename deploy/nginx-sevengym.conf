# /etc/nginx/sites-available/sevengym
# The app lives at 7gym.kz. The old addresses (sevengym / sevengim.matai.kz) keep working once their DNS points here:
# pages go to 7gym.kz, the API is answered in place so the Android app built for the old address keeps working.
# HTTPS: sudo certbot --nginx -d 7gym.kz -d www.7gym.kz   (later also -d sevengym.matai.kz -d sevengim.matai.kz)
server {
    listen 80;
    server_name 7gym.kz www.7gym.kz;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the API counts wrong codes per device by this address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name sevengym.matai.kz sevengim.matai.kz;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3100;
    }
    location / {
        return 301 https://7gym.kz$request_uri;
    }
}
